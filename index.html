<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PyScript Example</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body>
    <py-script>
        from js import fetch
        import asyncio

        async def load_external_script():
            response = await fetch('https://raw.githubusercontent.com/taisei1223/test/refs/heads/main/extra.py)
            content = await response.text()
            exec(content)

        asyncio.ensure_future(load_external_script())
    </py-script>
</body>
</html>
