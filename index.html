<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>External Script with PyScript</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/taisei1223/test/refs/heads/main/style.css">
    
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
    <py-config>packages = ["pandas"]</py-config>
</head>
<body>
    <!-- html のフ中身-->
    <p id="values"></p>

    <div class="background_test">
        <div class="logo_test">
            ロゴ
        </div>
    </div>

    <!--実行ファイルを設定しておく👇-->
    <!-- 実行ファイル①df　実行ファイル②hello-->
    <py-script src="https://raw.githubusercontent.com/taisei1223/test/refs/heads/main/extra.py"></py-script>
    <py-script src="https://raw.githubusercontent.com/taisei1223/test/refs/heads/main/hello.py"></py-script>
    <py-script>
        <!--関数を表示-->
        result = main()
        print(result)

        <!--実行ファイル②からhello関数を呼び出し-->
        hello=hello()
        
        <!--htmlのvlaue タグに対して hello変数を格納-->
        values = Element("values")
        values.element.innerText = hello


    </py-script>
</body>
</html>
